[package]
name = "nix-options-doc"
version = "0.2.0"
authors = ["Chinmay D. Pai <chinmaydpai@gmail.com>"]
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Generate multi-format documentation for Nix module options"
keywords = ["nix", "markdown", "html", "json", "csv", "documentation"]
repository = "https://github.com/Thunderbottom/nix-options-doc"
homepage = "https://github.com/Thunderbottom/nix-options-doc"
readme = "README.md"
include = ["src/**/*", "LICENSE*", "README.md"]
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
comrak = "0.54"
csv = "1.3"
env_logger = "0.11"
gix = { version = "0.86.0", features = ["blocking-network-client", "blocking-http-transport-reqwest-rust-tls"] }
html-escape = "0.2"
indicatif = "0.18"
log = "0.4"
rayon = "1.10"
regex = "1.11.1"
rnix = "0.14"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.17"
textwrap = "0.16"
thiserror = "2.0"
walkdir = "2.5"
rowan = "0.16"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
