[package]
name = "nix-options-doc"
version = "0.2.0"
authors = [
    "Chinmay D. Pai <chinmaydpai@gmail.com>",
    "Caleb Stewart <caleb.stewart94@gmail.com>",
]
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Generate multi-format documentation for Nix module options"
keywords = ["nix", "markdown", "html", "json", "csv", "documentation"]
repository = "https://github.com/calebstewart/nix-options-doc"
homepage = "https://github.com/calebstewart/nix-options-doc"
readme = "README.md"
include = ["src/**/*", "LICENSE*", "README.md"]
# This fork has never been published to crates.io (the `nix-options-doc` name
# is unclaimed there — upstream never published it either) and cuts no
# releases; install it with `cargo install --git …` or `nix build`. Drop this
# line if and when the fork decides to publish.
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
comrak = "0.54"
csv = "1.3"
env_logger = "0.11"
gix = { version = "0.86.0", features = ["blocking-network-client", "blocking-http-transport-reqwest-rust-tls"] }
html-escape = "0.2"
indicatif = "0.18"
log = "0.4"
rayon = "1.10"
regex = "1.11.1"
rnix = "0.14"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.17"
textwrap = "0.16"
thiserror = "2.0"
walkdir = "2.5"
rowan = "0.16"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[lints.rust]
unsafe_code = "deny"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
await_holding_lock = "warn"
char_lit_as_u8 = "warn"
checked_conversions = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
from_iter_instead_of_collect = "warn"
if_let_mutex = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
let_unit_value = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_ok_or = "warn"
map_err_ignore = "warn"
map_flatten = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
missing_enforced_import_renames = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_borrow = "warn"
needless_continue = "warn"
needless_for_each = "warn"
option_option = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
string_add_assign = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
unimplemented = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
useless_transmute = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"
